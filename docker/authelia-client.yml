# Add this under identity_providers.oidc.clients in your Authelia configuration.
# Generate the secret hash with:
#   docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --password 'the-same-secret-as-OIDC_CLIENT_SECRET'
- client_id: forkbell
  client_name: Forkbell
  client_secret: '$pbkdf2-sha512$...paste the hash here...'
  public: false
  authorization_policy: two_factor
  require_pkce: true
  pkce_challenge_method: S256
  redirect_uris:
    - https://forkbell.example.com/auth/callback
  scopes: [openid, profile, email]
  grant_types: [authorization_code]
  response_types: [code]
  token_endpoint_auth_method: client_secret_post
