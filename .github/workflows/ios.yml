name: iOS IPA
# Unsigned build for sideloading (SideStore / LiveContainer). Run it from the Actions tab.
on: workflow_dispatch

jobs:
  ipa:
    runs-on: macos-15
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Version from package.json, build number from this run: iOS shows "0.11.0 (42)",
      # and Settings shows the commit too.
      - name: Stamp the version
        id: version
        env:
          FORKBELL_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/build-info.mjs
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # The Liquid Glass app icon (assets/Forkbell.icon) needs Xcode 26 or newer.
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Generate the native iOS project
        working-directory: apps/app
        env:
          FORKBELL_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          CI=1 npx expo prebuild --platform ios --clean
          # The LiDAR camera is a local native module; fail loudly if it wasn't linked.
          grep -q "ForkbellDepth" ios/Podfile.lock || { echo "modules/forkbell-depth was not linked into the iOS build"; exit 1; }
      - name: Build unsigned app
        working-directory: apps/app/ios
        run: |
          xcodebuild -workspace Forkbell.xcworkspace -scheme Forkbell -configuration Release \
            -sdk iphoneos -archivePath "$RUNNER_TEMP/Forkbell.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Forkbell.xcarchive/Products/Applications/Forkbell.app" "$RUNNER_TEMP/Payload/"
          # Ad-hoc sign with the app's entitlements (HealthKit) so SideStore and
          # LiveContainer can see them when they re-sign the app with your account.
          codesign --force --deep --sign - --entitlements apps/app/ios/Forkbell/Forkbell.entitlements "$RUNNER_TEMP/Payload/Forkbell.app"
          cd "$RUNNER_TEMP" && zip -qr Forkbell.ipa Payload
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: Forkbell ${{ steps.version.outputs.version }} (iOS build ${{ github.run_number }})
          files: ${{ runner.temp }}/Forkbell.ipa
