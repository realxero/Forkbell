# Sign in the way a person would: server address, then username and password.
# The account comes from seed.mjs. Return moves from Username to Password and
# Return in Password signs in (the app wires both up), which avoids tapping
# iOS's secure password field and its Passwords bar, which automation trips on.
appId: com.realxero.forkbell
---
- launchApp:
    clearState: true
# clearState doesn't empty the iOS Keychain, where the app keeps its session,
# so a second try opens already signed in. Either screen is fine.
- extendedWaitUntil:
    visible: "forkbell.example.com|Train"
    timeout: 60000
- runFlow:
    when:
      visible: "forkbell.example.com"
    commands:
      - tapOn: "forkbell.example.com"
      # Typing straight after the tap can lose the first letters while the
      # keyboard is still coming up ("http://localhost:3999" became "hst:3999").
      # Wait for it, check what landed, and type it again if anything's missing.
      - waitForAnimationToEnd
      - inputText: ${SERVER}
      - runFlow:
          when:
            notVisible: ${SERVER}
          commands:
            - eraseText: 60
            - inputText: ${SERVER}
      - assertVisible: ${SERVER}
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Username"
          timeout: 30000
      - tapOn: "Username"
      - waitForAnimationToEnd
      - inputText: ${USERNAME}
      - runFlow:
          when:
            notVisible: ${USERNAME}
          commands:
            - eraseText: 40
            - inputText: ${USERNAME}
      - pressKey: Enter
      - waitForAnimationToEnd
      - inputText: ${PASSWORD}
      - pressKey: Enter
      # Signing in works, then iOS offers to save the password in a sheet that
      # hides the tab bar from automation. Wait for either, and decline.
      - extendedWaitUntil:
          visible: "Save Password\\?|Train"
          timeout: 60000
      - tapOn:
          text: "Not Now"
          optional: true
- extendedWaitUntil:
    visible: "Train"
    timeout: 60000
# Anything iOS asks on first open (notifications, Health): say no and carry on.
- tapOn:
    text: "Don.t Allow"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
