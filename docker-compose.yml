# Forkbell: Postgres, a one-shot migrator, and the server.
# Copy .env.example to .env and fill it in, then: docker compose up -d --build
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forkbell
      POSTGRES_USER: forkbell_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forkbell_admin -d forkbell"]
      interval: 5s
      retries: 20

  # Runs migrations as the admin, then exits. Only this container ever sees the admin password.
  migrate:
    build: .
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_ADMIN_URL: postgres://forkbell_admin:${POSTGRES_PASSWORD}@db:5432/forkbell
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  # A nightly copy of the whole database, kept for BACKUP_KEEP_DAYS (14) days.
  # Restore steps: docs/BACKUP.md. Copy the backups folder off this machine too.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./data/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/forkbell-$$(date +%Y-%m-%d_%H%M).dump
          if pg_dump -h db -U forkbell_admin -d forkbell -Fc -f "$$f.tmp"; then
            mv "$$f.tmp" "$$f" && echo "backup: saved $$f"
          else
            rm -f "$$f.tmp"; echo "backup: FAILED"
          fi
          find /backups -name 'forkbell-*.dump' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      db: { condition: service_healthy }

  server:
    build:
      context: .
      args:
        # Optional: the commit, if the build folder has no .git (Settings shows it).
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # The limited role: row-level security applies to everything it does.
      DATABASE_URL: postgres://forkbell_app:${APP_DB_PASSWORD}@db:5432/forkbell
      PUBLIC_URL: ${PUBLIC_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_NAME: ${OIDC_NAME:-Authelia}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-}
      PASSWORD_SIGNUP: ${PASSWORD_SIGNUP:-off}
      SIGNUP_CODE: ${SIGNUP_CODE:-}
      USDA_API_KEY: ${USDA_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_ALLOW_CUSTOM_URL: ${AI_ALLOW_CUSTOM_URL:-}
      SEARCH_URL: ${SEARCH_URL:-}
      MEALIE_URL: ${MEALIE_URL:-}
      MEALIE_TOKEN: ${MEALIE_TOKEN:-}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_VOICE: ${TTS_VOICE:-af_heart}
      TTS_MODEL: ${TTS_MODEL:-kokoro}
      TTS_API_KEY: ${TTS_API_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
